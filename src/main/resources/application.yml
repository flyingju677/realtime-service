server:
  port: 8894
  servlet:
    context-path: /myrealtime

realtime:
  enabled: true
  websocket:
    enabled: true
    path: /websocket/subscribe
    heartbeat:
      enabled: true
      interval: 5000
      timeout: 15000
  eventbus:
    type: memory
    async: true
  storage:
    type: memory
  thread-pool:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100
    keep-alive-seconds: 60
